
name: Build JAMAT SATHI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare website files
        run: |
          mkdir -p www
          npx esbuild notification-entry.js --bundle --format=iife --platform=browser --target=es2020 --outfile=www/notifications.bundle.js
          node --check www/notifications.bundle.js
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android    
        
      - name: Install Hindi voice alarm system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          package_dir = Path("android/app/src/main/java/com/jamatsathi/app")
          package_dir.mkdir(parents=True, exist_ok=True)

          source_dir = Path("android-custom/src/main/java/com/jamatsathi/app")

          for filename in [
              "PrayerSpeechPlugin.java",
              "SpeechAlarmReceiver.java",
              "PrayerSpeechService.java"
          ]:
              source = source_dir / filename
              if not source.exists():
                  raise SystemExit(f"Missing file: {source}")
              shutil.copy2(source, package_dir / filename)

          main = package_dir / "MainActivity.java"
          if not main.exists():
              raise SystemExit("MainActivity.java नहीं मिली")

          content = main.read_text()

          imports = [
              "import com.jamatsathi.app.PrayerSpeechPlugin;",
          ]

          for import_line in imports:
              if import_line not in content:
                  content = content.replace(
                      "import com.getcapacitor.BridgeActivity;",
                      "import com.getcapacitor.BridgeActivity;\n" + import_line
                  )

          if "registerPlugin(PrayerSpeechPlugin.class)" not in content:
              content = content.replace(
                  "public class MainActivity extends BridgeActivity {",
                  "public class MainActivity extends BridgeActivity {\n"
                  "    @Override\n"
                  "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  "        registerPlugin(PrayerSpeechPlugin.class);\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "    }"
              )
          main.write_text(content)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />'
          ]

          for permission in permissions:
              name = permission.split('"')[1]
              if name not in xml:
                  xml = xml.replace(
                      "<application",
                      permission + "\n    <application",
                      1
                  )

          components = """
              <receiver
                  android:name="com.jamatsathi.app.SpeechAlarmReceiver"
                  android:enabled="true"
                  android:exported="false" />

              <service
                  android:name="com.jamatsathi.app.PrayerSpeechService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="mediaPlayback" />
          """

          if "SpeechAlarmReceiver" not in xml:
              xml = xml.replace("</application>", components + "\n    </application>")

          manifest.write_text(xml)
          PY
          
      - name: Create notification sound
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          folder = Path("android/app/src/main/res/raw")
          folder.mkdir(parents=True, exist_ok=True)

          rate = 44100
          samples = []

          segments = [(880, 0.22), (0, 0.08), (660, 0.22), (0, 0.08), (880, 0.22)]

          for frequency, duration in segments:
              count = int(rate * duration)
              for i in range(count):
                  if frequency == 0:
                      value = 0
                  else:
                      fade = min(1.0, i / (rate * 0.015), (count - i) / (rate * 0.015))
                      value = int(10000 * fade * math.sin(2 * math.pi * frequency * i / rate))
                  samples.append(struct.pack("<h", value))

          with wave.open(str(folder / "jamat_alert.wav"), "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(rate)
              audio.writeframes(b"".join(samples))
          PY

      - name: Generate Android app icons
        run: |
          mkdir -p assets
          cp new-logo.png assets/icon.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
          ]
          for permission in permissions:
              permission_name = permission.split('"')[1]
              if permission_name not in s:
                  s = s.replace("<application", permission + "    <application", 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAMAT-SATHI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
