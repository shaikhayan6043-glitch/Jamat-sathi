name: Build JAMAT SATHI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare website files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android
      - name: Generate Android app icons
        run: |
          mkdir -p assets
          cp new-logo.png assets/icon.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android
      - name: Add exact alarm permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
          if "android.permission.SCHEDULE_EXACT_ALARM" not in s:
              s = s.replace("<application", permission + "    <application", 1)
              p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAMAT-SATHI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
